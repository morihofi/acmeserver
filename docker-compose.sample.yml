version: '3.8'

services:
  app:
    restart: unless-stopped
    build: .
    volumes:
      - ./serverdata:/app/serverdata
      - ./logs:/app/logs
    ports:
# Adjust the ports to be the same as in serverdata/settings.json defined
      - "80:80"
      - "443:443"

  tessera:
    image: ghcr.io/cloudflare/tessera:latest
    restart: unless-stopped
    ports:
      - "6105:6105"
