[package]
name = "certinstall"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
libloading = "0.8"
jni = "0.21"
tracing = "0.1"
tracing-subscriber = {version = "0.3", features = ["env-filter"]}
base64 = "0.22"
dirs = "6.0"
pem = "3.0"
sha1 = "0.10"
x509-parser = "0.17"
deunicode = "1.6"
nix = "0.30.1"
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"
crc32fast = "1.5.0"
thiserror = "2.0"
reqwest = {version = "0.12", features = ["rustls-tls", "blocking", "system-proxy", "trust-dns", "json", "gzip"]}
rustls = {version = "0.23", features = ["logging", "ring"]}
flate2 = "1.0"
indicatif = "0.17"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System",
    "Win32_System_Diagnostics",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Controls",
    "Win32_System_Console"
] }
windows-elevate = "0.1.0"


[profile.release]
opt-level = "z"         # Optimize for size ("s" for small, "z" for smallest)
lto = true              # Enable Link Time Optimization
codegen-units = 1       # Reduce parallel codegen to improve optimizations
panic = "abort"         # Reduce binary size by disabling unwinding
strip = true            # Strip debug symbols (Rust 1.59+)


# Two binaries, same source if you want
[[bin]]
name = "agentstub"
path = "src/main.rs"

[[bin]]
name = "agentstubw"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.9"
